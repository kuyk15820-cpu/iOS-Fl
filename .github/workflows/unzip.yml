name: Build & Release Unsigned IPA

on:
  workflow_dispatch: # ปุ่มกดสั่งรันเองแบบ Manual ใน GitHub
  push:
    branches:
      - release    # รันอัตโนมัติเมื่อมีการ Push โค้ดไปที่ branch 'release'

jobs:
  build-and-release:
    runs-on: macos-14 # ใช้ macOS Runner ตามตัวอย่างของคุณ

    steps:
      # 1. Checkout โค้ดของโปรเจกต์
      - name: Checkout Repository
        uses: actions/checkout@v4.1.1

      # 2. ตั้งค่า Xcode Version
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      # 3. ตั้งค่า Java Environment
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. ตั้งค่า Flutter SDK
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 5. ดึง Version จากไฟล์ pubspec.yaml เพื่อนำมาทำ Release Tag
      - name: Extract Version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | tr -d '\r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building Version: $VERSION"

      # 6. Install Dependencies
      - name: Install Flutter Dependencies
        run: flutter pub get

      # 7. แก้ไข iOS Deployment Target จาก 8.0 เป็น 12.0 ป้องกัน Xcode crash
      - name: Update iOS Deployment Target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 8.0;/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/g' ios/Runner.xcodeproj/project.pbxproj

      # 8. Build iOS Bundle แบบ No Code Signing
      - name: Build Flutter iOS App
        run: flutter build ios --release --no-codesign

      # 9. Pack ให้เป็นไฟล์ .ipa (ตั้งชื่อไฟล์ตามชื่อโปรเจกต์และเวอร์ชัน)
      - name: Package to Unsigned IPA
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r Payload.zip Payload
          mv Payload.zip Runner.ipa

      # 10. Upload Artifact เก็บสำรองไว้บน GitHub Actions
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: runner-${{ env.VERSION }}
          path: Runner.ipa

      # 11. สร้าง GitHub Release และอัปโหลดไฟล์ .ipa เข้าไปใน Release อัตโนมัติ
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          body: |
            ## 📱 Flutter Unsigned IPA Release
            - **Version:** ${{ env.VERSION }}
            - **Support:** TrollStore / ESign / Sideload
            
            *ไฟล์ IPA นี้สร้างจากระบบ Build อัตโนมัติ (Unsigned) สามารถนำไปติดตั้งผ่าน TrollStore หรือเซ็นสัญญาเพิ่มใน ESign ได้ทันที*
          draft: false
          prerelease: false
          files: |
            Runner.ipa
